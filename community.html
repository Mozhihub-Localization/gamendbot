
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101018">
  <title>GAMEND X Community</title>
  <link rel="stylesheet" href="community.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">GAMEND <span>X</span></a>
    <div class="online-status">
      <span class="online-dot"></span>
      <span id="onlineCount">0 Online</span>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
  </header>

  <main class="community">
    <section id="guestPanel" class="panel guest-panel">
      <h1>Join the Community</h1>
      <p>Connect, chat and share with gamers.</p>
      <form id="joinForm">
        <input id="displayName" maxlength="30" placeholder="Your display name" required>
        <input id="username" maxlength="20" placeholder="Username (a-z, 0-9, _)" required>
        <button class="primary-btn" type="submit">Join Community</button>
      </form>
    </section>

    <section id="chatPanel" class="chat-panel hidden">
      <div class="chat-heading">
        <div>
          <h1>Community Chat</h1>
          <p>Be respectful. Keep it friendly.</p>
        </div>
        <button id="leaveBtn" class="secondary-btn">Leave</button>
      </div>

      <div id="replyPreview" class="reply-preview hidden">
        <div>
          <small>Replying to</small>
          <strong id="replyName"></strong>
          <p id="replyText"></p>
        </div>
        <button id="cancelReply" aria-label="Cancel reply">✕</button>
      </div>

      <div id="messages" class="messages" aria-live="polite">
        <div class="empty-state">Loading messages...</div>
      </div>

      <form id="messageForm" class="composer">
        <textarea id="messageInput" rows="1" maxlength="1500"
          placeholder="Write a message..." required></textarea>
        <button id="sendBtn" class="send-btn" type="submit">Send</button>
      </form>
    </section>
  </main>

  <div id="contextMenu" class="context-menu hidden">
    <button data-action="reply">Reply</button>
    <button data-action="copy">Copy</button>
    <button data-action="edit">Edit</button>
    <button data-action="delete" class="danger-text">Delete</button>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="community.js"></script>
</body>
</html>
